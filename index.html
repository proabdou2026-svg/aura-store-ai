<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraStore AI Pro - متجر الذكاء الاصطناعي</title>
    <!-- استدعاء مكتبات رياكت وتايليند لتشغيل المتجر مباشرة وبشكل مذهل -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        return (
          <div className="p-6 max-w-4xl mx-auto">
            <header className="flex justify-between items-center border-b border-gray-700 pb-4 mb-6">
              <h1 className="text-3xl font-bold text-indigo-400">AuraStore AI Pro</h1>
              <span className="bg-indigo-600 px-3 py-1 rounded-full text-sm">العملة: درهم مغربي (MAD)</span>
            </header>
            <main className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
                <h2 className="text-xl font-semibold mb-3">لوحة تحكم المتجر الذكي</h2>
                <p className="text-gray-300 mb-4">مرحباً بك يا عبد الصمد! نظام إدارة المنتجات والذكاء الاصطناعي يعمل بكفاءة تامة.</p>
                <div className="bg-indigo-950 p-4 rounded-lg text-indigo-200 font-mono text-lg">
                  السعر النموذجي: 499.00 MAD
                </div>
              </div>
              <div className="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 flex flex-col justify-center items-center text-center">
                <div className="text-4xl mb-2">🚀</div>
                <h3 className="text-lg font-bold text-green-400">الموقع يعمل بنجاح تام!</h3>
                <p className="text-sm text-gray-400 mt-2">تم ربط النشر بنجاح على منصة Vercel.</p>
              </div>
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
