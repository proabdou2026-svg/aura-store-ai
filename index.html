<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraStore AI Enterprise - المنصة الذكية المتكاملة</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel JS -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Cairo', sans-serif; }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #0b0f19; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    </style>
  </head>
  <body class="bg-[#0b0f19] text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function App() {
        const [step, setStep] = useState('auth');
        const [userEmail, setUserEmail] = useState('');
        const [emailError, setEmailError] = useState('');
        const [authProvider, setAuthProvider] = useState('');
        const [otpCode, setOtpCode] = useState(['', '', '', '', '', '']);
        const [showOAuthModal, setShowOAuthModal] = useState(false);
        const [selectedOAuth, setSelectedOAuth] = useState('');

        const [settings, setSettings] = useState({
          country: 'المغرب',
          currency: 'MAD',
          currencySymbol: 'MAD',
          language: 'العربية',
          taxRate: '20%'
        });

        const [storeData, setStoreData] = useState({
          projectName: 'Aura Store Morocco',
          businessType: 'إلكترونيات وساعات ذكية',
          inventorySize: '250',
          monthlySalesTarget: '100000'
        });

        const [activeTab, setActiveTab] = useState('dashboard');
        const [aiInput, setAiInput] = useState('');
        const [aiMessages, setAiMessages] = useState([
          { role: 'assistant', text: 'أهلاً بك في AuraStore AI Enterprise! أنا المساعد الذكي الخاص بمتجرك. كيف يمكنني إفادتك في التحليلات أو إدارة المبيعات اليوم؟' }
        ]);
        const [isAiLoading, setIsAiLoading] = useState(false);

        const chartRef = useRef(null);
        const chartInstance = useRef(null);

        useEffect(() => {
          const symbols = { 'MAD': 'MAD', 'USD': '$', 'EUR': '€', 'SAR': 'SAR' };
          setSettings(prev => ({ ...prev, currencySymbol: symbols[prev.currency] || prev.currency }));
        }, [settings.currency]);

        useEffect(() => {
          if (step === 'app' && activeTab === 'dashboard' && chartRef.current) {
            if (chartInstance.current) {
              chartInstance.current.destroy();
            }
            const ctx = chartRef.current.getContext('2d');
            chartInstance.current = new Chart(ctx, {
              type: 'line',
              data: {
                labels: ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو'],
                datasets: [
                  {
                    label: `المبيعات (${settings.currency})`,
                    data: [180000, 240000, 220000, 310000, 380000, 420000, 510000],
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.12)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 3
                  },
                  {
                    label: `الأرباح صافية (${settings.currency})`,
                    data: [95000, 130000, 115000, 170000, 200000, 230000, 280000],
                    borderColor: '#06b6d4',
                    backgroundColor: 'rgba(6, 182, 212, 0.08)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 2
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { labels: { color: '#9ca3af', font: { family: 'Cairo' } } }
                },
                scales: {
                  x: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } },
                  y: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } }
                }
              }
            });
          }
        }, [step, activeTab, settings.currency]);

        const validateEmail = (email) => {
          const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          return re.test(String(email).toLowerCase());
        };

        const handleEmailSubmit = (e) => {
          e.preventDefault();
          if (!validateEmail(userEmail)) {
            setEmailError('يرجى إدخال بريد إلكتروني حقيقي وصحيح (مثل name@domain.com)');
            return;
          }
          setEmailError('');
          setAuthProvider('Email Verification');
          setStep('otp');
        };

        const handleOAuthClick = (provider) => {
          setSelectedOAuth(provider);
          setShowOAuthModal(true);
        };

        const confirmOAuthLogin = (accountEmail) => {
          setUserEmail(accountEmail);
          setAuthProvider(selectedOAuth);
          setShowOAuthModal(false);
          setStep('setup');
        };

        const handleOtpSubmit = (e) => {
          e.preventDefault();
          setStep('setup');
        };

        const handleSetupSubmit = (e) => {
          e.preventDefault();
          setStep('app');
        };

        const handleSendMessage = () => {
          if (!aiInput.trim()) return;
          const userText = aiInput;
          setAiMessages(prev => [...prev, { role: 'user', text: userText }]);
          setAiInput('');
          setIsAiLoading(true);

          setTimeout(() => {
            setAiMessages(prev => [...prev, {
              role: 'assistant',
              text: `تحليل واستشارة ذكية لمشروعك (${storeData.projectName}):\n\n💡 **التوصية:** بناءً على التداول بعملة (${settings.currency}) والسوق في (${settings.country})، تم تحسين خوارزميات التنبؤ التلقائي لزيادة أرباح المبيعات بنسبة 18%.`
            }]);
            setIsAiLoading(false);
          }, 1000);
        };

        if (step === 'auth') {
          return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#0b0f19] via-[#111827] to-[#0b0f19]">
              <div className="w-full max-w-md bg-[#111827] border border-gray-800 rounded-3xl p-8 shadow-2xl relative">
                <div className="text-center mb-8">
                  <div className="w-14 h-14 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center text-emerald-400 font-black text-2xl mx-auto mb-4">
                    ❖
                  </div>
                  <h1 className="text-2xl font-black text-white">AuraStore AI Enterprise</h1>
                  <p className="text-xs text-gray-400 mt-2">منصة إدارة التجارة والمتاجر الذكية العالمية</p>
                </div>

                <div className="space-y-3 mb-6">
                  <button 
                    onClick={() => handleOAuthClick('Google')}
                    className="w-full bg-gray-900 hover:bg-gray-800 border border-gray-800 text-white font-semibold py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-3 transition">
                    <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
                    تسجيل الدخول عبر Google
                  </button>

                  <button 
                    onClick={() => handleOAuthClick('Apple / iCloud')}
                    className="w-full bg-gray-900 hover:bg-gray-800 border border-gray-800 text-white font-semibold py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-3 transition">
                    <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.85c.68-.83 1.14-1.99.01-3.14-1 .04-2.23.68-2.95 1.52-.64.75-1.2 1.93-1.05 3.09 1.13.09 2.31-.56 2.99-1.47z"/></svg>
                    تسجيل الدخول عبر Apple / iCloud
                  </button>

                  <button 
                    onClick={() => handleOAuthClick('Microsoft')}
                    className="w-full bg-gray-900 hover:bg-gray-800 border border-gray-800 text-white font-semibold py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-3 transition">
                    <svg className="w-4 h-4" viewBox="0 0 23 23"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
                    تسجيل الدخول عبر Microsoft
                  </button>
                </div>

                <div className="flex items-center my-6">
                  <div className="flex-1 border-t border-gray-800"></div>
                  <span className="px-3 text-[10px] text-gray-500 uppercase font-bold">أو البريد الإلكتروني المباشر</span>
                  <div className="flex-1 border-t border-gray-800"></div>
                </div>

                <form onSubmit={handleEmailSubmit} className="space-y-4">
                  <div>
                    <input 
                      type="email" 
                      placeholder="أدخل بريدك الإلكتروني (مثل: user@gmail.com)" 
                      value={userEmail} 
                      onChange={(e) => { setUserEmail(e.target.value); setEmailError(''); }}
                      className={`w-full bg-gray-900 border rounded-xl px-4 py-3 text-xs text-white focus:outline-none transition ${emailError ? 'border-red-500' : 'border-gray-800 focus:border-emerald-500'}`}
                    />
                    {emailError && <p className="text-[11px] text-red-400 mt-1">{emailError}</p>}
                  </div>
                  <button 
                    type="submit" 
                    className="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20">
                    إرسال رمز التحقق ←
                  </button>
                </form>

                {showOAuthModal && (
                  <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div className="bg-[#111827] border border-gray-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                      <h3 className="text-base font-bold text-white mb-2">اختيار حساب {selectedOAuth}</h3>
                      <p className="text-xs text-gray-400 mb-4">اختر الحساب الذي تريد المتابعة به إلى AuraStore AI:</p>
                      
                      <div className="space-y-2 mb-6">
                        <button 
                          onClick={() => confirmOAuthLogin(`abdessamad.${selectedOAuth.toLowerCase().replace(/[^a-z]/g, '')}@gmail.com`)}
                          className="w-full text-right p-3 bg-gray-800 hover:bg-gray-700/80 rounded-xl border border-gray-700 flex items-center gap-3 transition">
                          <div className="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-400 text-emerald-300 font-bold text-xs flex items-center justify-center">ع</div>
                          <div>
                            <p className="text-xs font-bold text-white">عبد الصمد (الحساب الرئيسي)</p>
                            <p className="text-[10px] text-gray-400">abdessamad@{selectedOAuth.toLowerCase().replace(/[^a-z]/g, '')}.com</p>
                          </div>
                        </button>
                      </div>

                      <button 
                        onClick={() => setShowOAuthModal(false)}
                        className="w-full py-2 bg-gray-800 text-gray-400 font-semibold rounded-xl text-xs hover:text-white transition">
                        إلغاء
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        if (step === 'otp') {
          return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#0b0f19] via-[#111827] to-[#0b0f19]">
              <div className="w-full max-w-md bg-[#111827] border border-gray-800 rounded-3xl p-8 shadow-2xl text-center">
                <div className="w-12 h-12 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center text-emerald-400 font-bold text-xl mx-auto mb-4">
                  ✉️
                </div>
                <h2 className="text-xl font-bold text-white">إدخال رمز التحقق</h2>
                <p className="text-xs text-gray-400 mt-2 mb-6">تم إرسال رمز أمان إلى بريدك:<br/><strong className="text-emerald-400">{userEmail}</strong></p>

                <form onSubmit={handleOtpSubmit} className="space-y-6">
                  <div className="flex justify-center gap-2" dir="ltr">
                    {[0, 1, 2, 3, 4, 5].map((idx) => (
                      <input 
                        key={idx}
                        type="text"
                        maxLength="1"
                        defaultValue={idx + 1}
                        className="w-10 h-12 bg-gray-900 border border-gray-800 rounded-xl text-center text-white font-bold text-lg focus:outline-none focus:border-emerald-500"
                      />
                    ))}
                  </div>
                  <button 
                    type="submit" 
                    className="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20">
                    تأكيد الدخول ←
                  </button>
                </form>
              </div>
            </div>
          );
        }

        if (step === 'setup') {
          return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#0b0f19] via-[#111827] to-[#0b0f19]">
              <div className="w-full max-w-lg bg-[#111827] border border-gray-800 rounded-3xl p-8 shadow-2xl">
                <div className="mb-6">
                  <span className="text-[10px] font-bold text-emerald-400 bg-emerald-950/80 px-2.5 py-1 rounded-full border border-emerald-800/50">إعداد بيئة العمل</span>
                  <h2 className="text-xl font-bold text-white mt-3">إعدادات متجرك الأولية</h2>
                  <p className="text-xs text-gray-400 mt-1">تنسيق الدولة والعملة لضبط الإحصائيات والذكاء الاصطناعي.</p>
                </div>

                <form onSubmit={handleSetupSubmit} className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-gray-300 mb-1">اسم المشروع / المتجر</label>
                      <input 
                        type="text" 
                        required 
                        value={storeData.projectName} 
                        onChange={(e) => setStoreData({...storeData, projectName: e.target.value})}
                        className="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-300 mb-1">نوع النشاط</label>
                      <input 
                        type="text" 
                        required 
                        value={storeData.businessType} 
                        onChange={(e) => setStoreData({...storeData, businessType: e.target.value})}
                        className="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-gray-300 mb-1">الدولة</label>
                      <select 
                        value={settings.country} 
                        onChange={(e) => setSettings({...settings, country: e.target.value})}
                        className="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                        <option value="المغرب">المغرب 🇲🇦</option>
                        <option value="السعودية">السعودية 🇸🇦</option>
                        <option value="الإمارات">الإمارات 🇦🇪</option>
                        <option value="فرنسا">فرنسا 🇫🇷</option>
                        <option value="أمريكا">أمريكا 🇺🇸</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-gray-300 mb-1">العملة الأساسية</label>
                      <select 
                        value={settings.currency} 
                        onChange={(e) => setSettings({...settings, currency: e.target.value})}
                        className="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                        <option value="MAD">درهم مغربي (MAD)</option>
                        <option value="USD">دولار أمريكي (USD $)</option>
                        <option value="EUR">يورو (EUR €)</option>
                        <option value="SAR">ريال سعودي (SAR)</option>
                      </select>
                    </div>
                  </div>

                  <button 
                    type="submit" 
                    className="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20 mt-4">
                    🚀 فتح لوحة التحكم الرئيسية
                  </button>
                </form>
              </div>
            </div>
          );
        }

        return (
          <div className="flex h-screen overflow-hidden">
            <aside className="w-64 bg-[#111827] border-l border-gray-800 p-5 flex flex-col justify-between shrink-0">
              <div>
                <div className="flex items-center gap-3 mb-8">
                  <div className="w-10 h-10 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-xl flex items-center justify-center text-black font-black text-xl shadow-lg shadow-emerald-500/20">
                    A
                  </div>
                  <div>
                    <h1 className="font-bold text-base text-white truncate max-w-[130px]">{storeData.projectName}</h1>
                    <span className="text-[10px] text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-800/50 font-mono">ENTERPRISE LIVE</span>
                  </div>
                </div>

                <nav className="space-y-2">
                  <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition ${activeTab === 'dashboard' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'text-gray-400 hover:bg-gray-800/60'}`}>
                    📊 لوحة التحكم الرئيسية
                  </button>
                  <button onClick={() => setActiveTab('ai-assistant')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition ${activeTab === 'ai-assistant' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'text-gray-400 hover:bg-gray-800/60'}`}>
                    ✨ مساعد Gemini AI
                  </button>
                  <button onClick={() => setActiveTab('inventory')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition ${activeTab === 'inventory' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'text-gray-400 hover:bg-gray-800/60'}`}>
                    📦 إدارة المخزون
                  </button>
                  <button onClick={() => setActiveTab('logs')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition ${activeTab === 'logs' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'text-gray-400 hover:bg-gray-800/60'}`}>
                    📜 سجل العمليات (Audit Logs)
                  </button>
                  <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition ${activeTab === 'settings' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'text-gray-400 hover:bg-gray-800/60'}`}>
                    ⚙️ إعدادات الدولة والعملة
                  </button>
                </nav>
              </div>

              <div className="pt-4 border-t border-gray-800">
                <div className="bg-gray-800/50 p-3 rounded-xl border border-gray-700/50 flex items-center justify-between">
                  <div className="flex items-center gap-2 overflow-hidden">
                    <div className="w-8 h-8 rounded-full bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center text-emerald-300 font-bold text-xs">ع</div>
                    <div className="overflow-hidden">
                      <p className="text-xs font-bold text-white truncate max-w-[100px]">{userEmail}</p>
                      <p className="text-[10px] text-emerald-400 font-medium">{authProvider}</p>
                    </div>
                  </div>
                  <button onClick={() => setStep('auth')} className="text-gray-500 hover:text-red-400 text-xs font-bold transition">خروج</button>
                </div>
              </div>
            </aside>

            <main className="flex-1 flex flex-col h-screen overflow-y-auto custom-scrollbar p-8 bg-[#0b0f19]">
              <header className="flex flex-wrap justify-between items-center gap-4 mb-8 pb-4 border-b border-gray-800">
                <div>
                  <h2 className="text-2xl font-black text-white">{storeData.projectName}</h2>
                  <p className="text-xs text-gray-400 mt-1">الدولة: {settings.country} | العملة المفضلة: {settings.currencySymbol} ({settings.currency})</p>
                </div>
                <div className="flex items-center gap-3">
                  <span className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold px-3 py-2 rounded-xl">🟢 متصل وجاهز</span>
                  <button className="bg-gradient-to-r from-emerald-500 to-teal-500 text-black font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-lg">+ إضافة منتج جديد</button>
                </div>
              </header>

              {activeTab === 'dashboard' && (
                <div className="space-y-8">
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                    <div className="bg-[#111827] p-5 rounded-2xl border border-gray-800">
                      <p className="text-xs font-semibold text-gray-400 mb-2">إجمالي المبيعات</p>
                      <p className="text-2xl font-black text-white">510,000 <span className="text-xs font-bold text-emerald-400">{settings.currencySymbol}</span></p>
                    </div>
                    <div className="bg-[#111827] p-5 rounded-2xl border border-gray-800">
                      <p className="text-xs font-semibold text-gray-400 mb-2">صافي الأرباح</p>
                      <p className="text-2xl font-black text-white">280,000 <span className="text-xs font-bold text-cyan-400">{settings.currencySymbol}</span></p>
                    </div>
                    <div className="bg-[#111827] p-5 rounded-2xl border border-gray-800">
                      <p className="text-xs font-semibold text-gray-400 mb-2">المخزون المتوفر</p>
                      <p className="text-2xl font-black text-white">{storeData.inventorySize} <span className="text-xs font-normal text-gray-400">قطعة</span></p>
                    </div>
                    <div className="bg-[#111827] p-5 rounded-2xl border border-gray-800">
                      <p className="text-xs font-semibold text-gray-400 mb-2">توصيات AI</p>
                      <p className="text-2xl font-black text-amber-400">3</p>
                    </div>
                  </div>
                  <div className="bg-[#111827] p-6 rounded-2xl border border-gray-800">
                    <h3 className="text-base font-bold text-white mb-1">مسار الأداء المالي والنمو ({settings.currencySymbol})</h3>
                    <div className="h-72"><canvas ref={chartRef}></canvas></div>
                  </div>
                </div>
              )}

              {activeTab === 'ai-assistant' && (
                <div className="flex-1 flex flex-col bg-[#111827] rounded-2xl border border-gray-800 overflow-hidden h-[580px]">
                  <div className="p-4 bg-gray-800/50 border-b border-gray-800">
                    <h3 className="text-base font-bold text-white">✨ مساعد Gemini AI المباشر</h3>
                  </div>
                  <div className="flex-1 p-4 overflow-y-auto space-y-4 custom-scrollbar">
                    {aiMessages.map((msg, idx) => (
                      <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[75%] p-4 rounded-2xl text-xs leading-relaxed ${msg.role === 'user' ? 'bg-emerald-500 text-black font-semibold rounded-br-none' : 'bg-gray-800 text-gray-200 border border-gray-700/80 rounded-bl-none whitespace-pre-line'}`}>
                          {msg.text}
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="p-4 border-t border-gray-800 bg-gray-900/50 flex gap-3">
                    <input type="text" placeholder="اكتب استفسارك هنا..." value={aiInput} onChange={(e) => setAiInput(e.target.value)} className="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-500" />
                    <button onClick={handleSendMessage} className="bg-emerald-500 hover:bg-emerald-600 text-black font-bold px-6 py-3 rounded-xl text-xs transition">إرسال</button>
                  </div>
                </div>
              )}

              {activeTab === 'inventory' && (
                <div className="bg-[#111827] p-6 rounded-2xl border border-gray-800">
                  <h3 className="text-base font-bold text-white mb-6">إدارة المنتجات والمخزون</h3>
                  <table className="w-full text-right text-xs text-gray-300">
                    <thead className="bg-gray-800/60 text-gray-400 font-bold uppercase border-b border-gray-700">
                      <tr><th className="p-3">اسم المنتج</th><th className="p-3">الفئة</th><th className="p-3">السعر ({settings.currencySymbol})</th><th className="p-3">الكمية</th></tr>
                    </thead>
                    <tbody className="divide-y divide-gray-800">
                      <tr><td className="p-3 font-semibold text-white">ساعة Aura Smart Watch Pro</td><td className="p-3">إلكترونيات</td><td className="p-3 font-bold text-emerald-400">899.00 {settings.currencySymbol}</td><td className="p-3">85 قطعة</td></tr>
                    </tbody>
                  </table>
                </div>
              )}

              {activeTab === 'logs' && (
                <div className="bg-[#111827] p-6 rounded-2xl border border-gray-800">
                  <h3 className="text-base font-bold text-white mb-6">📜 سجل النشاطات والأمان (Audit Logs)</h3>
                  <div className="p-3 bg-gray-900/60 border border-gray-800 rounded-xl text-xs">
                    <span className="text-emerald-400 font-bold">تسجيل دخول ناجح</span>
                    <p className="text-gray-400 text-[11px] mt-0.5">الحساب: {userEmail} عبر {authProvider}</p>
                  </div>
                </div>
              )}

              {activeTab === 'settings' && (
                <div className="bg-[#111827] p-8 rounded-2xl border border-gray-800 max-w-2xl">
                  <h3 className="text-lg font-bold text-white mb-2">⚙️ إعدادات الدولة والعملة والتوطين</h3>
                  <div className="space-y-5">
                    <div>
                      <label className="block text-xs font-bold text-gray-300 mb-2">الدولة النشطة</label>
                      <select value={settings.country} onChange={(e) => setSettings({...settings, country: e.target.value})} className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-xs text-white">
                        <option value="المغرب">المغرب 🇲🇦</option><option value="السعودية">السعودية 🇸🇦</option><option value="الإمارات">الإمارات 🇦🇪</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-300 mb-2">العملة الرسمية</label>
                      <select value={settings.currency} onChange={(e) => setSettings({...settings, currency: e.target.value})} className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-xs text-white">
                        <option value="MAD">الدرهم المغربي (MAD)</option><option value="USD">الدولار الأمريكي ($)</option><option value="SAR">الريال السعودي (SAR)</option>
                      </select>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
